name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The package declares os: ["win32"]; npm ci rejects other platforms.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
